<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CMS Cookie Co. · Admin</title>
<meta name="theme-color" content="#FFF9F2">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<!-- Home-screen icon. Served from public paths: browsers fetch manifests without cookies, so /admin/* would hit the Access login.
     Deliberately NOT a full-screen web app (no apple-mobile-web-app-capable, manifest display "browser"): a full-screen
     home-screen app has its own cookie jar and bounces the Cloudflare Access sign-in out to another window, so the
     icon kept landing on the public site. As a plain browser bookmark it opens /admin/ in Safari/Chrome, where the
     Access sign-in lasts a month. -->
<link rel="manifest" href="/pwa/admin.webmanifest">
<meta name="apple-mobile-web-app-title" content="CMS Admin">
<meta name="application-name" content="CMS Admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Figtree:wght@400;500;600;700&family=Josefin+Sans:wght@600;700&family=Kalam:wght@400;700&family=Kaushan+Script&display=swap">
<script type="module" src="/admin/studio.js"></script>
<style>
/* Admin: same flyer paper, pink ribbons and green type as the public site, laid out for one thumb on a phone. */
:root{
  --paper:#FFF9F2; --panel:#FFFDF9; --green:#1F4A37; --pink:#E54F7C; --pink-btn:#D63F6D; --pink-soft:#F7C3D0; --pink-line:#F1AFC0;
  --blush:#FCE6EC; --cocoa:#4A2A1E; --muted:#7C5A4E; --line:rgba(74,42,30,.14); --ok:#2F7A4F;
  --f-display:"Abril Fatface", Georgia, serif; --f-hand:"Kalam", "Comic Sans MS", cursive;
  --f-caps:"Josefin Sans", "Century Gothic", sans-serif; --f-body:"Figtree", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0; background:var(--paper); color:var(--cocoa); font:400 16px/1.5 var(--f-body); -webkit-font-smoothing:antialiased; padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--pink); outline-offset:2px; border-radius:8px}
.wrap{max-width:760px; margin:0 auto; padding:0 max(16px, env(safe-area-inset-left,0px)) 0 max(16px, env(safe-area-inset-right,0px))}

header{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--pink-soft); padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex; align-items:center; gap:10px; padding-block:10px}
.brand{font:400 22px/1 var(--f-display); color:var(--green); margin-right:auto; text-decoration:none; display:flex; align-items:center; gap:8px}
.brand small{font:700 11px var(--f-caps); letter-spacing:.18em; text-transform:uppercase; color:var(--pink); background:var(--blush); padding:5px 8px 3px; border-radius:999px}
.who{font-size:12.5px; color:var(--muted); max-width:42vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.viewsite{font:700 12px var(--f-caps); letter-spacing:.08em; text-transform:uppercase; color:var(--green); text-decoration:none; border:1.5px solid var(--green); border-radius:999px; padding:7px 10px 5px; white-space:nowrap}

h1.page{font:400 34px/1.1 var(--f-hand); font-weight:700; color:var(--green); margin:18px 0 6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
h1.page .sub{font:500 14px var(--f-body); color:var(--muted)}
.bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 14px}

.card{background:var(--panel); border:1.5px solid var(--pink-line); border-radius:16px; padding:16px; margin-bottom:14px; position:relative}
.card.off{opacity:.62}
.card h3{margin:0; font:700 20px/1.2 var(--f-hand); color:var(--green)}
.meta{font-size:13.5px; color:var(--muted)}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.spacer{margin-left:auto}
.tag{display:inline-block; font:700 11.5px var(--f-caps); letter-spacing:.08em; text-transform:uppercase; padding:4px 9px 2px; border-radius:999px; background:var(--blush); color:var(--pink-btn)}
.tag.green{background:#E3F0E8; color:var(--ok)} .tag.warn{background:#FFE9C7; color:#8A5200}
.price{font:700 22px/1 var(--f-hand); color:var(--pink)}
.thumb{width:100%; max-height:220px; object-fit:cover; border-radius:10px; margin-top:10px; background:#eee}
/* Same shapes the public site shows, so what Shaun frames is what she sees here. */
.thumb.circle{width:160px; max-height:none; aspect-ratio:1; border-radius:50%}
.thumb.square{width:200px; max-height:none; aspect-ratio:1}
.thumb.wide{max-height:none; aspect-ratio:4/3}
.thumb.whole{width:auto; max-width:100%; max-height:320px; object-fit:contain; background:none}
video.thumb{background:#000}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:999px; padding:12px 18px; font-weight:700; font-size:15px; text-decoration:none; min-height:44px}
.btn-rose{background:var(--pink-btn); color:#fff}
.btn-green{background:var(--green); color:#fff}
.btn-ghost{background:#fff; border:1.5px solid var(--line); color:var(--cocoa)}
.btn-danger{background:#fff; border:1.5px solid #E7A0B4; color:#B42D55}
.btn-sm{padding:8px 14px; min-height:38px; font-size:14px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.chip{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; font-weight:700; font-size:14px}
.chip[aria-pressed="true"]{background:var(--green); border-color:var(--green); color:#fff}

/* Switch toggles */
.switch{display:inline-flex; align-items:center; gap:10px; font-weight:700; font-size:15px; cursor:pointer; user-select:none; min-height:44px}
.switch input{appearance:none; -webkit-appearance:none; width:50px; height:30px; border-radius:15px; background:#D9CBC4; position:relative; transition:background .2s; margin:0; flex:none; cursor:pointer}
.switch input::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
.switch input:disabled{opacity:.5}

/* Forms */
form.edit{display:grid; gap:12px}
.field{display:grid; gap:5px}
.field label, .field .lbl{font-weight:700; font-size:14px}
.field input:not([type=checkbox]):not([type=file]), .field select, .field textarea{width:100%; font-size:16px; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:11px 13px}
.field textarea{min-height:88px; resize:vertical}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--pink)}
.field .hint{font-size:12.5px; color:var(--muted)}
/* Long phone file names (IMG_1234.MOV) must not widen the form past the card. */
form.edit, .field, .field > *{min-width:0}
.field input[type=file]{width:100%; max-width:100%; overflow:hidden; text-overflow:ellipsis}
.err{overflow-wrap:anywhere}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.upl{display:grid; gap:8px}
.upl img, .upl video{max-width:100%; max-height:180px; border-radius:10px; object-fit:cover}
.upl img.thumb{margin-top:0}
.upl .row .btn{flex:1 1 auto}
.progress{height:8px; border-radius:4px; background:var(--blush); overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--pink-btn); transition:width .2s}
.err{color:#B42D55; font-weight:600; font-size:14px}
.note-warm{margin:0; padding:10px 12px; border-radius:12px; background:#FFF3E5; font-size:15px; line-height:1.45}
.empty{text-align:center; color:var(--muted); padding:28px 10px; font:400 19px var(--f-hand)}

/* Orders */
.items{margin:10px 0 0; padding:0; list-style:none; display:grid; gap:4px; font-size:15px}
.items li{display:flex; gap:8px}
.items li span:last-child{margin-left:auto; font-weight:700; white-space:nowrap}
.items small{color:var(--muted); display:block}
.contact{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.toggles{display:flex; gap:18px; flex-wrap:wrap; margin-top:8px; border-top:1px dashed var(--pink-soft); padding-top:6px}

/* Menu */
.mrow{display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px dashed var(--pink-soft)}
.mrow:last-child{border-bottom:0}
.mrow b{font:700 17px/1.2 var(--f-hand)}
.mrow .dollar{display:flex; align-items:center; gap:4px; font-weight:700}
.mrow input[type=number]{width:78px; font-size:16px; border:1.5px solid var(--line); border-radius:10px; padding:8px 8px; background:#fff}
.mrow .switch{min-height:auto}
.mrow .switch span{display:none}
.irow{padding:12px 0; border-bottom:1px dashed var(--pink-soft); display:grid; gap:8px}
.irow:last-child{border-bottom:0}
.itop{display:grid; grid-template-columns:52px 1fr auto; gap:12px; align-items:center}
.ithumb{width:52px; height:52px; object-fit:cover; background:var(--blush); display:grid; place-items:center; font-size:24px}
.ithumb.circle{border-radius:50%} .ithumb.square{border-radius:10px}
.iname{min-width:0} .iname b{font:700 18px/1.2 var(--f-hand); display:block; overflow-wrap:anywhere}
.irow .switch{min-height:auto} .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.iact{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.iact [data-move]{min-width:48px; font-size:18px}
.iact .confirm{flex:1 1 100%; font-size:15px}
#flavorForm:not(:empty), #treatForm:not(:empty){margin-top:12px}
.subhead{font:700 13px var(--f-caps); letter-spacing:.14em; text-transform:uppercase; color:var(--pink); margin:16px 0 0}

/* Menu: three big "add" buttons; sizes editor */
.bigadd{display:grid; gap:10px; margin:0 0 14px}
.bigbtn{display:grid; gap:2px; text-align:left; width:100%; border:2px solid var(--pink-line); background:#fff; border-radius:16px; padding:14px 16px; min-height:64px}
.bigbtn b{font:700 19px/1.2 var(--f-body); color:var(--pink-btn)}
.bigbtn span{font-size:14.5px; color:var(--muted)}
.szrow{display:grid; grid-template-columns:1fr 104px auto; gap:8px; align-items:center; margin-top:8px}
.szrow input{width:100%; font-size:16px; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px}
.szrow .dollar{display:flex; align-items:center; gap:4px; font-weight:700}

/* Requests */
.statusrow{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
.statusrow .chip{min-height:46px; font-size:15px}
.statusrow .chip[data-st=declined][aria-pressed=true]{background:#8C7B74; border-color:#8C7B74}
.wants{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.req .facts{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:6px; font-weight:700}
.req .field{margin-top:12px}
.bigswitch{font-size:17px}
.itemrow{display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:8px}
.itemrow input{width:100%; font-size:16px; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px}

/* Event signups */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center}
.stats b{display:block; font:700 24px/1.1 var(--f-hand); color:var(--green)}
.stats span{font-size:12.5px; color:var(--muted)}
.reg .row h3{font-size:19px}
.back{margin-top:12px}
details.dl summary{cursor:pointer; font-weight:700; list-style:none; display:flex; align-items:center; gap:8px; min-height:28px}
details.dl summary::-webkit-details-marker{display:none}
details.dl summary::after{content:"+"; margin-left:auto; color:var(--pink); font-size:22px}
details.dl[open] summary::after{content:"−"}

/* Payments */
.pay .payhead{display:flex; align-items:center; gap:12px}
.pay .payhead h3{flex:1}
.payico{width:40px; height:40px; border-radius:10px; flex:none; display:grid; place-items:center; color:#fff; font:800 22px/1 var(--f-body)}
.payico.venmo{background:#3D95CE} .payico.cashapp{background:#00C244} .payico.cash{background:var(--green); font-size:19px} .payico.card{background:#8C7B74; font-size:19px}
.prefix{display:flex; align-items:center; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding-left:13px}
.prefix:focus-within{border-color:var(--pink)}
.prefix span{font-weight:700; color:var(--muted)}
.field .prefix input:not([type=checkbox]){border:0; padding-left:4px; background:transparent}
.pay .field{margin-top:12px}
.pay .meta{margin:10px 0 0}
.card.soon{opacity:.6; background:#F6F0EC}
.pay .sqname{margin:12px 0 0; font-size:17px}
.pay .warnnote{color:#8A5200; font-weight:700}
.pay #sqConfirm .confirm{display:block; margin:12px 0 8px; font-size:15px}
.paylink{margin-top:12px; padding:12px; border-radius:12px; background:#FFF3E5}
.paylink .meta{margin:0 0 8px}
.paylink input{width:100%; box-sizing:border-box; font:500 14px var(--f-body); padding:10px; border:1.5px solid var(--line, #E5D6CE); border-radius:10px; background:#fff; color:inherit}

/* Tab bar */
nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:1.5px solid var(--pink-soft); display:flex; gap:2px; padding:6px max(4px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px, env(safe-area-inset-left,0px))}
nav.tabs button{flex:1 1 auto; min-width:0; border:0; background:none; display:grid; justify-items:center; gap:2px; padding:6px 1px; font:700 9.5px var(--f-caps); letter-spacing:0; text-transform:uppercase; color:var(--muted); border-radius:12px; position:relative; white-space:nowrap}
nav.tabs svg{width:24px; height:24px}
nav.tabs button[aria-current="page"]{color:var(--green); background:var(--blush)}
nav.tabs .badge{position:absolute; top:2px; left:calc(50% + 6px); min-width:18px; height:18px; border-radius:9px; background:var(--pink-btn); color:#fff; font:700 11px/18px var(--f-body); padding:0 5px}

.toast{position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,16px); background:var(--cocoa); color:#fff; padding:11px 18px; border-radius:999px; font-weight:700; font-size:14.5px; opacity:0; transition:.25s; z-index:40; pointer-events:none; width:max-content; max-width:calc(100vw - 32px); text-align:center}
.toast.on{opacity:1; transform:translate(-50%,0)}
.toast.bad{background:#B42D55}
.gate{margin-top:40px; text-align:center}

/* Help */
.help{padding:0; overflow:hidden}
.help summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:16px; min-height:56px}
.help summary::-webkit-details-marker{display:none}
.help summary .ico{width:40px; height:40px; flex:none; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 35% 30%,#F59AB0,#E25A82); color:#fff; font-size:20px}
.help summary h3{flex:1}
.help summary::after{content:"+"; font:700 24px/1 var(--f-body); color:var(--pink)}
.help[open] summary::after{content:"−"}
.help .body{padding:0 16px 16px; border-top:1px dashed var(--pink-soft)}
.help ol{margin:12px 0 0; padding-left:0; list-style:none; counter-reset:step; display:grid; gap:10px}
.help ol li{counter-increment:step; display:grid; grid-template-columns:28px 1fr; gap:10px; font-size:16px; line-height:1.45}
.help ol li::before{content:counter(step); width:28px; height:28px; border-radius:50%; background:var(--green); color:#fff; font:700 14px/28px var(--f-body); text-align:center}
.help b.ui{background:var(--blush); color:var(--pink-btn); padding:1px 7px; border-radius:6px; font-weight:700; white-space:nowrap}
.help .tip{margin:12px 0 0; padding:10px 12px; border-radius:12px; background:#FFF3E5; font-size:15px; line-height:1.45}
.help .tip::before{content:"♥ "; color:var(--pink)}
.help .or{margin:12px 0 0; font:700 13px var(--f-caps); letter-spacing:.12em; text-transform:uppercase; color:var(--pink)}
.help .go{margin-top:12px}
.help .stepimg{display:block; width:min(240px,72vw); height:auto; margin:8px 0 2px; border-radius:14px; border:1.5px solid var(--pink-line); background:#f4ece6; box-shadow:0 8px 18px -12px rgba(74,42,30,.5)}
.clipview{position:fixed; inset:0; z-index:60; background:#1E0C08; display:grid; grid-template-rows:auto 1fr; padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.clipview .cv-top{display:flex; align-items:center; gap:10px; color:#fff; padding-bottom:10px}
.clipview .cv-top b{flex:1; font:700 19px/1.2 var(--f-hand)}
.clipview video{width:100%; height:100%; max-height:calc(100svh - 90px); object-fit:contain; background:#000; border-radius:12px}
@media (max-width:380px){ .two{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition-duration:.001ms!important} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/admin/">CMS <small>Admin</small></a>
    <span class="who" id="who"></span>
    <a class="viewsite" href="/" target="_blank" rel="noopener">View site</a>
  </div>
</header>

<main class="wrap" id="main"><p class="empty" style="margin-top:40px">Opening your kitchen…</p></main>

<nav class="tabs" aria-label="Admin sections">
  <button data-tab="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16l-1.5 12h-13z"/><path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/></svg>Orders<span class="badge" id="openBadge" hidden></span></button>
  <button data-tab="requests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14h4"/></svg>Requests<span class="badge" id="reqBadge" hidden></span></button>
  <button data-tab="specials"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>Specials</button>
  <button data-tab="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Events</button>
  <button data-tab="media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/></svg>Media</button>
  <button data-tab="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Menu</button>
  <button data-tab="payments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10.5h19"/><path d="M6.5 15h4"/></svg>Payments</button>
  <button data-tab="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6v.6"/><path d="M12 17.2v.1"/></svg>Help</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ Helpers ============ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => n == null ? "" : "$" + (Math.round(n*100) % 100 ? Number(n).toFixed(2) : String(Math.round(n)));
const MAX_UPLOAD = 100 * 1024 * 1024;
const UPLOAD_TYPES = ["image/jpeg","image/png","image/webp","video/mp4","video/quicktime"];
// Some browsers leave file.type empty for .mov/.mp4; fall back to the extension.
const fileType = f => f.type || ({mov:"video/quicktime", mp4:"video/mp4", jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", webp:"image/webp"})[(f.name.split(".").pop() || "").toLowerCase()] || "";
let tt;
function toast(msg, bad=false){ const t = $("#toast"); t.textContent = msg; t.classList.toggle("bad", bad); t.classList.add("on"); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("on"), bad ? 4200 : 2200); }
function prettyDate(v, opts={weekday:"short", month:"short", day:"numeric"}){ if (!v) return ""; const [y,m,d] = v.slice(0,10).split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-US", opts); }
function ago(iso){ const d = new Date(iso); return d.toLocaleString("en-US", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); }

class ApiError extends Error { constructor(msg, status){ super(msg); this.status = status; } }
async function api(method, path, body){
  const res = await fetch("/api/admin/" + path, {
    method, credentials:"same-origin",
    headers: body !== undefined ? {"Content-Type":"application/json", Accept:"application/json"} : {Accept:"application/json"},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok){
    if (res.status === 401 || res.status === 503) showGate(data.error);
    throw new ApiError(data.error || `Request failed (${res.status})`, res.status);
  }
  return data;
}
function upload(file, onProgress){
  return new Promise((resolve, reject) => {
    const type = fileType(file);
    if (!UPLOAD_TYPES.includes(type)) return reject(new Error("That kind of file can't be uploaded. Use a photo (JPG, PNG, WebP) or a video (MP4 or MOV)."));
    if (file.size > MAX_UPLOAD) return reject(new Error("Files must be 100 MB or smaller"));
    const x = new XMLHttpRequest();
    x.open("PUT", "/api/admin/upload");
    x.setRequestHeader("Content-Type", type);
    x.upload.onprogress = e => e.lengthComputable && onProgress && onProgress(e.loaded / e.total);
    x.onload = () => { let d = {}; try{ d = JSON.parse(x.responseText); }catch(e){}
      x.status < 300 ? resolve(d) : reject(new Error(d.error || `Upload failed (${x.status})`)); };
    x.onerror = () => reject(new Error("Upload failed. Check your connection."));
    x.send(file);
  });
}
function showGate(msg){
  $("#main").innerHTML = `<div class="card gate"><h3>Please sign in again</h3><p class="meta">${esc(msg || "Your admin session ended.")}</p><a class="btn btn-rose" href="/admin/">Sign in</a></div>`;
}

function go(t, arg){
  if (!TABS[t]) t = "orders";
  tab = t; history.replaceState(null, "", "#" + t);
  $$("nav.tabs button").forEach(b => b.dataset.tab === t ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
  return TABS[t](arg).catch(e => { if (e.status !== 401 && e.status !== 503) $("#main").innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p></div>`; });
}

/* ============ Square (card payments): status, tags, "Send pay link" ============ */
// {configured:false} while the Worker has no Square credentials: then nothing card-related shows anywhere.
let SQUARE = null;
async function squareState(force){
  if (force || !SQUARE){ try{ SQUARE = (await api("GET", "square")).square; }catch(e){ SQUARE = SQUARE || {configured:false}; } }
  return SQUARE;
}
const payLinkOn = () => !!(SQUARE && SQUARE.connected && SQUARE.enabled);
const paidTag = x => x.paid_method === "card" ? `<span class="tag green">Paid by card</span>` : `<span class="tag green">Paid</span>`;
const payLinkButton = ref => payLinkOn() ? `<button class="btn btn-ghost btn-sm" type="button" data-paylink="${esc(ref)}">💳 Send pay link</button>` : "";
// Refunds stay in Square: a link there, nothing more.
const openSquare = x => x.paid_method === "card" && SQUARE?.dashboard_url ? `<a class="btn btn-ghost btn-sm" href="${esc(SQUARE.dashboard_url)}" target="_blank" rel="noopener">Refund? Open Square</a>` : "";
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-paylink]"); if (!b) return;
  const card = b.closest(".card"), open = $(".paylink", card);
  if (open){ open.remove(); return; }
  const label = b.textContent; b.disabled = true; b.textContent = "Making the link…";
  try{
    const r = await api("POST", "square/links", {ref: b.dataset.paylink});
    if (r.paid){ toast("That's already paid by card. ♥"); b.remove(); return; }
    const digits = (r.phone || "").replace(/[^\d+]/g, ""), first = String(r.name || "").split(/\s+/)[0] || "them";
    card.insertAdjacentHTML("beforeend", `<div class="paylink"><p class="meta">Card payment link for <b>${money(r.amount)}</b>. It switches on <b>Paid</b> by itself when they pay.</p>
      <input readonly value="${esc(r.url)}" aria-label="Pay link">
      <div class="contact"><a class="btn btn-green btn-sm" href="sms:${esc(digits)}?&body=${encodeURIComponent(r.message)}">Text it to ${esc(first)}</a><button class="btn btn-ghost btn-sm" type="button" data-copylink>Copy link</button></div></div>`);
    const box = $(".paylink", card);
    $("[data-copylink]", box).addEventListener("click", async () => {
      try{ await navigator.clipboard.writeText(r.url); toast("Link copied. Paste it in a text."); }
      catch(x){ const i = $("input", box); i.focus(); i.select(); toast("Selected. Copy it, then paste it in a text."); }
    });
  }catch(x){ toast(x.message, true); }
  b.disabled = false; b.textContent = label;
});

  if (orderFilter === "open") setBadge(orders.length);
  $("#main").innerHTML = `
    <h1 class="page">Orders <span class="sub">${orders.length} ${orderFilter === "open" ? "open" : "total"}</span></h1>
    <div class="bar">
      <button class="chip" data-f="open" aria-pressed="${orderFilter==="open"}">Open</button>
      <button class="chip" data-f="all" aria-pressed="${orderFilter==="all"}">All</button>
      <button class="btn btn-ghost btn-sm spacer" id="refresh">Refresh</button>
    </div>
    ${orders.length ? orders.map(orderCard).join("") : `<p class="empty">${orderFilter === "open" ? "No open orders. Time for a cookie. ♥" : "No orders yet."}</p>`}
    <details class="card dl" id="ordersDl"><summary>⬇ Download a spreadsheet of orders</summary>
      <div class="two" style="margin-top:12px"><div class="field"><label for="dlFrom">From</label><input id="dlFrom" type="date" value="${daysAgo(29)}"></div>
        <div class="field"><label for="dlTo">To</label><input id="dlTo" type="date" value="${todayStr()}"></div></div>
      <p class="meta" style="margin:8px 0 12px">Opens in Excel, Numbers or Google Sheets. Starts as the last 30 days.</p>
      <a class="btn btn-green btn-sm" id="dlGo" href="/api/admin/orders.csv" download>Download spreadsheet</a></details>`;
  const dlHref = () => { $("#dlGo").href = `/api/admin/orders.csv?from=${encodeURIComponent($("#dlFrom").value)}&to=${encodeURIComponent($("#dlTo").value)}`; };
  $("#dlFrom").addEventListener("change", dlHref); $("#dlTo").addEventListener("change", dlHref); dlHref();
  $$("[data-f]").forEach(b => b.addEventListener("click", () => { orderFilter = b.dataset.f; renderOrders(); }));
  $("#refresh").addEventListener("click", renderOrders);
  $$("[data-toggle]").forEach(inp => inp.addEventListener("change", async () => {
    const [id, field] = inp.dataset.toggle.split("|");
    inp.disabled = true;
    try{
      const {order} = await api("PATCH", "orders/" + encodeURIComponent(id), {[field]: inp.checked});
      toast(`${id}: ${field === "paid" ? (order.paid ? "marked paid" : "marked unpaid") : (order.confirmed ? "confirmed" : "unconfirmed")}`);
      $(`[data-order="${CSS.escape(id)}"] .status`).innerHTML = statusTags(order);
    }catch(e){ inp.checked = !inp.checked; toast(e.message, true); }
    inp.disabled = false;
  }));
}
function statusTags(o){
  return `${o.confirmed ? `<span class="tag green">Confirmed</span>` : `<span class="tag">New</span>`} ${o.paid ? paidTag(o) : `<span class="tag warn">Unpaid</span>`}`
    + (o.email_status === "failed" ? ` <span class="tag warn" title="The notification email didn't send">Email failed</span>` : "");
}
function orderCard(o){
  const digits = o.phone.replace(/[^\d+]/g, "");
  return `<article class="card" data-order="${esc(o.id)}">
    <div class="row"><h3>${esc(o.name)}</h3><span class="price spacer">${money(o.total)}</span></div>
    <div class="meta">${esc(o.id)} · placed ${esc(ago(o.created_at))}</div>
    <div class="row" style="margin-top:6px"><b>Wanted ${esc(prettyDate(o.wanted_date))}</b><span class="meta">· ${o.fulfillment === "delivery" ? "Delivery" : "Pickup"}</span></div>
    <div class="status" style="margin-top:6px">${statusTags(o)}</div>

/* ============ Drafts: survive Android closing the page while the camera is open ============ */
// Taking a photo hands the phone to the camera app. On Android, Chrome may throw the admin page away to free
// memory, and the page reloads empty when she comes back. So every form is saved to this tab's
// sessionStorage as she types, and put back on load. `picking` = she'd just opened the camera/gallery.
const DRAFT_KEY = "cms-draft", DRAFT_MAX_AGE = 2 * 3600e3;
const draftStore = {
  get(){ try{ const d = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null"); return d && Date.now() - d.at < DRAFT_MAX_AGE ? d : null; }catch(e){ return null; } },
  set(d){ try{ sessionStorage.setItem(DRAFT_KEY, JSON.stringify({...d, at: Date.now()})); }catch(e){} },
  clear(){ try{ sessionStorage.removeItem(DRAFT_KEY); }catch(e){} },
};
const LOST_PHOTO = "Your phone closed this page while the camera was open, so the photo didn't come through. Everything you typed is still here. Tap Take photo to try again, or Choose photo to pick it from your gallery.";
const lostPhotoNote = () => `<p class="note-warm" data-lostphoto role="status">${esc(LOST_PHOTO)}</p>`;
// Every photo button tells the form when the camera/gallery opens and when a photo comes back.
function watchPicks(root, onPick){
  $$("input[data-pick]", root).forEach(inp => {
    inp.addEventListener("click", () => onPick(true));
    inp.addEventListener("cancel", () => onPick(false));
    inp.addEventListener("change", () => onPick(false));
  });
}

// Calendar days back from today (safe across daylight-saving changes).
function daysAgo(n){ const d = new Date(); d.setDate(d.getDate() - n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

async function renderCrud(cfg, editing){
  const data = await api("GET", cfg.path);
  const rows = data[cfg.listKey];
  $("#main").innerHTML = `
    <h1 class="page">${cfg.title}</h1>
    <p class="meta" style="margin:0 0 12px">${cfg.sub}</p>
    <div class="bar"><button class="btn btn-rose" id="addNew">+ New ${cfg.noun}</button></div>
    <div id="formSlot"></div>
    ${rows.length ? rows.map(r => `<article class="card ${cfg.isOff(r) ? "off" : ""}" data-id="${r.id}">${cfg.card(r)}
      <div class="row" style="margin-top:12px">${cfg.buttons ? cfg.buttons(r) : ""}<button class="btn btn-ghost btn-sm" data-edit="${r.id}">Edit</button><button class="btn btn-danger btn-sm" data-del="${r.id}">Delete</button></div></article>`).join("")
      : `<p class="empty">No ${cfg.noun}s yet.</p>`}`;
  $("#addNew").addEventListener("click", () => openForm(cfg, null));
  $$("[data-edit]").forEach(b => b.addEventListener("click", () => openForm(cfg, rows.find(r => r.id === +b.dataset.edit))));
  $$("[data-del]").forEach(b => b.addEventListener("click", async () => {
    const r = rows.find(x => x.id === +b.dataset.del);
    if (!confirm(`Delete "${r.title}"?${cfg.deleteNote ? cfg.deleteNote(r) : ""} This can't be undone.`)) return;
    try{ await api("DELETE", `${cfg.path}/${r.id}`); toast("Deleted"); renderCrud(cfg); }catch(e){ toast(e.message, true); }
  }));
  cfg.wire?.(rows);
  if (editing !== undefined) openForm(cfg, editing);
}

function fieldHtml(f, v){
  const id = "f_" + f.name;
  if (f.pair) return `<div class="two">${f.pair.map(p => fieldHtml(p, v)).join("")}</div>`;
  const val = v?.[f.name] ?? (f.default ?? "");
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : "";
  switch (f.type){
    case "select": { const sv = val === true ? "1" : val === false ? "0" : String(val);
      return `<div class="field"><label for="${id}">${f.label}</label><select id="${id}" name="${f.name}">${f.options.map(([k,l]) => `<option value="${k}" ${sv===k?"selected":""}>${l}</option>`).join("")}</select>${hint}</div>`; }
    case "sizes": {
      const list = typeof val === "string" ? (val ? JSON.parse(val) : []) : (val || []);
      return `<div class="field" data-sizesbox="${f.name}"><span class="lbl">${f.label}</span>${hint}
        <input type="hidden" name="${f.name}" value="${esc(JSON.stringify(list.map(z => ({id: z.id, label: z.label, price: z.price}))))}">
        <div data-szrows></div>
        <button type="button" class="btn btn-ghost btn-sm" data-szadd style="justify-self:start; margin-top:8px">+ Add a size</button></div>`;
    }
    case "number": return `<div class="field"><label for="${id}">${f.label}</label><input id="${id}" name="${f.name}" type="number" inputmode="numeric" step="1" min="${f.min ?? 1}" max="${f.max ?? 1000}" value="${esc(val ?? "")}">${hint}</div>`;
    case "textarea": return `<div class="field"><label for="${id}">${f.label}</label><textarea id="${id}" name="${f.name}" maxlength="${f.max||1000}">${esc(val)}</textarea>${hint}</div>`;
    case "money": return `<div class="field"><label for="${id}">${f.label}</label><input id="${id}" name="${f.name}" type="number" inputmode="decimal" step="0.01" min="0" max="1000" value="${val ?? ""}">${hint}</div>`;
    case "date": return `<div class="field"><label for="${id}">${f.label}</label><input id="${id}" name="${f.name}" type="date" value="${esc(val)}" ${f.required?"required":""}>${hint}</div>`;
    case "url": return `<div class="field"><label for="${id}">${f.label}</label><input id="${id}" name="${f.name}" type="url" inputmode="url" placeholder="https://" value="${esc(val)}">${hint}</div>`;
    case "switch": return `<label class="switch"><input type="checkbox" name="${f.name}" ${val === true || val === 1 ? "checked" : ""}> ${f.label}</label>`;
    case "image": return photoFieldHtml(f, v);
    default: return `<div class="field"><label for="${id}">${f.label}</label><input id="${id}" name="${f.name}" value="${esc(val)}" maxlength="${f.max||200}" ${f.required?"required":""} ${f.suggest ? `list="dl_${f.name}" autocomplete="off"` : ""}>${hint}
      ${f.suggest ? `<datalist id="dl_${f.name}">${f.suggest().map(o => `<option value="${esc(o)}">`).join("")}</datalist>` : ""}</div>`;
  }
}

// Shape = how the public site shows it: circle (Cookie of the Month, flavors), square (treats, gallery),

const SHAPE_HINT = {circle:"Shows as a circle on the site.", square:"Shows as a square on the site.", wide:"Shows as a wide 4×3 picture on the site.", whole:"The whole flyer shows on the site. Nothing gets cut off."};
function photoButtons(hasPhoto){

function photoFieldHtml(f, v){
  const url = v?.[f.preview], orig = v?.[f.origPreview];
  return `<div class="field"><span class="lbl">${f.label}</span><div class="upl" data-upl="${f.name}">
    <input type="hidden" name="${f.name}" value="${esc(v?.[f.name] ?? "")}">

    <img class="thumb" alt="" ${url ? `src="${esc(url)}"` : "hidden"} data-orig="${esc(orig || "")}">
    <div class="progress" hidden><i></i></div>
    ${photoButtons(!!url)}
    <span class="hint" data-shapehint></span></div></div>`;
}
// Opens the studio, uploads the framed photo (and the untouched original when there's a new one).
// Resolves to {key, origKey, url} or null if cancelled.
async function studioUpload({source, shape, price, keepOrigKey, bar}){
  if (!window.PhotoStudio) throw new Error("The photo tool is still loading. Try again in a moment.");
  const r = await window.PhotoStudio.open({source, shape, price});
  if (!r) return null;
  if (bar){ bar.hidden = false; $("i", bar).style.width = "0"; }
  const parts = r.original ? 2 : 1; let done = 0;
  const prog = p => { if (bar) $("i", bar).style.width = ((done + p) / parts * 100) + "%"; };
  try{
    const photo = await upload(r.photo, prog); done = 1;
    const origKey = r.original ? (await upload(r.original, prog)).key : keepOrigKey || null;
    return {key: photo.key, url: photo.url, origKey};
  } finally { if (bar) bar.hidden = true; }
}
function wireUploads(root, fields){
  $$("[data-upl]", root).forEach(box => {
    const f = fields.find(x => x.name === box.dataset.upl);
    const [hidden, origHidden] = $$("input[type=hidden]", box), img = $("img", box), bar = $(".progress", box);
    const shape = () => f.shape ? f.shape(root) : "square";
    const showHint = () => { $("[data-shapehint]", box).textContent = SHAPE_HINT[shape()]; img.className = "thumb " + shape(); };
    const refresh = has => { $("[data-editphoto]", box).hidden = !has; $("[data-clear]", box).hidden = !has; img.hidden = !has; };
    const run = async (source, keepOrigKey) => {
      try{
        const r = await studioUpload({source, shape: shape(), price: f.price ? f.price(root) : null, keepOrigKey, bar});
        if (!r) return;
        hidden.value = r.key; origHidden.value = r.origKey || ""; img.src = r.url; img.dataset.orig = ""; refresh(true);
        root.dispatchEvent(new Event("photo-ready"));
        toast("Photo ready. Tap Save to keep it.");
      }catch(e){ toast(e.message, true); }
    };
    $$("[data-pick]", box).forEach(inp => inp.addEventListener("change", () => { const file = inp.files[0]; inp.value = ""; if (file) run(file); }));
    $("[data-editphoto]", box).addEventListener("click", () => {
      // Start from the untouched original when there is one; older photos open from the photo itself.
      const origUrl = img.dataset.orig || (origHidden.value ? `/media/${origHidden.value}` : "");
      run(origUrl ? {url: origUrl, isOriginal: true} : {url: img.src, isOriginal: false}, origHidden.value || null);
    });
    $("[data-clear]", box).addEventListener("click", () => { hidden.value = ""; origHidden.value = ""; img.removeAttribute("src"); refresh(false); root.dispatchEvent(new Event("photo-ready")); });
    showHint();
    root.addEventListener("change", e => { if (e.target.name === "kind") showHint(); });
  });
}
// Sizes editor: rows of name + price (up to 6), kept as JSON in a hidden input so Save and drafts see it.
function wireSizeEditor(form){
  $$("[data-sizesbox]", form).forEach(box => {
    const hidden = $("input[type=hidden]", box), rowsEl = $("[data-szrows]", box), add = $("[data-szadd]", box);
    let list = JSON.parse(hidden.value || "[]");
    const sync = () => { hidden.value = JSON.stringify(list); add.hidden = list.length >= 6; form.dispatchEvent(new Event("input")); };
    const draw = () => {
      rowsEl.innerHTML = list.map((z, i) => `<div class="szrow">
        <input data-szl="${i}" value="${esc(z.label ?? "")}" maxlength="40" placeholder="${i === 0 ? "Kit for 2" : i === 1 ? "Family kit" : "Size name"}" aria-label="Size ${i + 1} name">
        <span class="dollar">$<input data-szp="${i}" type="number" inputmode="decimal" step="0.01" min="0" max="1000" value="${z.price ?? ""}" aria-label="Size ${i + 1} price"></span>
        <button type="button" class="btn btn-danger btn-sm" data-szdel="${i}" aria-label="Remove size ${i + 1}">✕</button></div>`).join("");
      $$("[data-szl]", rowsEl).forEach(inp => inp.addEventListener("input", () => { list[+inp.dataset.szl].label = inp.value; sync(); }));
      $$("[data-szp]", rowsEl).forEach(inp => inp.addEventListener("input", () => { list[+inp.dataset.szp].price = inp.value; sync(); }));
      $$("[data-szdel]", rowsEl).forEach(b => b.addEventListener("click", () => { list.splice(+b.dataset.szdel, 1); draw(); sync(); }));
      add.hidden = list.length >= 6;
    };
    add.addEventListener("click", () => { if (list.length >= 6) return; list.push({label:"", price:""}); draw(); sync(); $$("[data-szl]", rowsEl).at(-1).focus(); });
    draw();
  });
}
function openForm(cfg, row, restored){
  const slot = $(cfg.slot || "#formSlot");
  const flat = cfg.fields.flatMap(f => f.pair || [f]);
  // A restored draft: the saved values over the row, with photo previews rebuilt from their keys.
  let v = row;
  if (restored){
    v = {...(row || {}), ...restored.values};
    for (const f of flat) if (f.type === "image"){
      v[f.preview] = v[f.name] ? `/media/${v[f.name]}` : null;
      v[f.origPreview] = v[f.orig] ? `/media/${v[f.orig]}` : null;
    }
  }
  slot.innerHTML = `<form class="card edit" novalidate>
    <h3>${row ? "Edit " + cfg.noun : cfg.newTitle || "New " + cfg.noun}</h3>
    ${restored?.picking ? lostPhotoNote() : ""}
    ${cfg.fields.map(f => fieldHtml(f, v)).join("")}
    <p class="err" hidden></p>
    <div class="row"><button class="btn btn-rose" type="submit">Save</button><button class="btn btn-ghost" type="button" data-cancel>Cancel</button></div>
  </form>`;
  const form = $("form", slot);
  wireUploads(form, flat);
  wireSizeEditor(form);
  const values = () => Object.fromEntries(flat.flatMap(f => {
    const el = form.elements[f.name], out = [[f.name, f.type === "switch" ? el.checked : el.value]];
    if (f.orig) out.push([f.orig, form.elements[f.orig].value]);
    return out;
  }));
  let picking = false;
  const saveDraft = () => draftStore.set({tab, path: cfg.path, id: row?.id ?? null, values: values(), picking});
  form.addEventListener("input", saveDraft);
  form.addEventListener("change", saveDraft);
  form.addEventListener("photo-ready", saveDraft);
  watchPicks(form, on => { picking = on; saveDraft(); if (!on) $("[data-lostphoto]", form)?.remove(); });
  if (restored) saveDraft();
  $("[data-cancel]", form).addEventListener("click", () => { draftStore.clear(); slot.innerHTML = ""; });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const body = {};
    for (const f of flat){
      const el = form.elements[f.name];
      body[f.name] = f.type === "switch" ? el.checked : f.type === "sizes" ? JSON.parse(el.value || "[]") : el.value.trim();
      if (f.orig) body[f.orig] = form.elements[f.orig].value;
      if (f.required && !body[f.name]){ return showErr(form, `${f.label} is required`); }
    }
    const btn = $("[type=submit]", form); btn.disabled = true; btn.textContent = "Saving…";
    try{
      await api(row ? "PUT" : "POST", row ? `${cfg.path}/${row.id}` : cfg.path, body);
      draftStore.clear();
      toast(row ? "Saved" : `${cfg.noun[0].toUpperCase() + cfg.noun.slice(1)} added`);
      cfg.reload ? cfg.reload() : renderCrud(cfg);
    }catch(err){ showErr(form, err.message); btn.disabled = false; btn.textContent = "Save"; }
  });
  slot.scrollIntoView({behavior:"smooth", block:"start"});
  $("input:not([type=hidden]), select, textarea", form)?.focus({preventScroll:true});
}
function showErr(form, msg){ const p = $(".err", form); p.textContent = msg; p.hidden = false; }

  if (restored){

  }

  form.addEventListener("change", saveDraft);
  watchPicks(pf, on => { picking = on; saveDraft(); if (!on) $("[data-lostphoto]", form)?.remove(); });
  const runPhoto = async (source, keepOrigKey) => {
    try{
      const r = await studioUpload({source, shape:"square", keepOrigKey, bar: $(".progress", pf)});

      mPhoto = r; $("#mPhotoErr").hidden = true; saveDraft();

    }catch(e){ toast(e.message, true); }
  };
  $$("[data-pick]", pf).forEach(inp => inp.addEventListener("change", () => { const f = inp.files[0]; inp.value = ""; if (f) runPhoto(f); }));

  $$("[data-feat]").forEach(inp => inp.addEventListener("change", async () => {
    inp.disabled = true;
    try{ await api("PATCH", "media/" + inp.dataset.feat, {featured: inp.checked}); toast(inp.checked ? "Featured" : "Not featured"); }
    catch(e){ inp.checked = !inp.checked; toast(e.message, true); }
    inp.disabled = false;
  }));
  $$("[data-medit]").forEach(b => b.addEventListener("click", async () => {
    const m = media.find(x => x.id === +b.dataset.medit);
    try{
      const r = await studioUpload({source: m.orig ? {url: m.orig, isOriginal: true} : {url: m.url, isOriginal: false}, shape:"square", keepOrigKey: m.orig_key});
      if (!r) return;

      toast("Photo updated"); renderMedia();
    }catch(e){ toast(e.message, true); }

  }));
}

/* ============ Payments: which ways customers see, and the names in the pay links ============ */

// Connect Square (Square's own sign-in + Allow), then an on/off switch. No codes are typed here.
function squareCard(p, sq){
  const head = `<div class="payhead"><span class="payico card" aria-hidden="true">💳</span><h3>Card (Square)</h3>${sq.connected
    ? `<label class="switch"><input type="checkbox" data-payon ${p.enabled ? "checked" : ""} aria-label="Show card payments to customers"><span class="sr">On</span></label>` : ""}</div>`;
  if (!sq.connected) return `<section class="card pay" data-pay="card">${head}

    ${sq.note ? `<p class="meta warnnote">${esc(sq.note)}</p>` : ""}
    <button class="btn btn-rose" type="button" id="sqConnect" style="margin-top:12px">Connect Square</button>
    <p class="meta">Square opens. Sign in there and tap <b>Allow</b>. You never type a password or code on this site.</p></section>`;
  return `<section class="card pay" data-pay="card">${head}
    <p class="sqname">Connected as <b>${esc(sq.business_name)}</b></p>
    <p class="meta" data-cardsay>${p.enabled ? "On: customers see “Pay with card” after they order or sign up." : "Off: customers don't see card yet. Switch it on when you're ready."}</p>
    <p class="meta">Square takes a fee on each card payment. See your Square app for the amount.</p>
    <p class="meta">Refunds and payouts happen in Square.</p>
    <div class="contact"><a class="btn btn-green btn-sm" href="${esc(sq.dashboard_url)}" target="_blank" rel="noopener">Open Square</a><button class="btn btn-ghost btn-sm" type="button" id="sqDisc">Disconnect</button></div>
    <div id="sqConfirm"></div></section>`;
}
async function renderPayments(){

  const card = p => {
    const info = PAY_INFO[p.id];
    if (p.id === "card" && !p.coming_soon && sq.configured) return squareCard(p, sq);
    if (p.coming_soon) return `<section class="card pay soon" data-pay="${p.id}"><div class="payhead"><span class="payico card" aria-hidden="true">${info.ico}</span><h3>${esc(p.label)}</h3><span class="tag">Coming soon</span></div>
      <p class="meta">${esc(info.say)}</p></section>`;
    return `<section class="card pay" data-pay="${p.id}">
      <div class="payhead"><span class="payico ${p.id}" aria-hidden="true">${info.ico}</span><h3>${esc(p.label)}</h3>
        <label class="switch"><input type="checkbox" data-payon ${p.enabled ? "checked" : ""} aria-label="Show ${esc(p.label)} to customers"><span class="sr">On</span></label></div>
      ${info.prefix ? `<div class="field"><label for="ph_${p.id}">${info.nameLabel}</label>
        <div class="prefix"><span aria-hidden="true">${info.prefix}</span><input id="ph_${p.id}" data-payname value="${esc(p.handle || "")}" maxlength="31" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="${p.id === "venmo" ? "CmsCookieCo" : "YourCashtag"}"></div>
        <span class="hint">Saves by itself when you tap somewhere else. Letters, numbers, - and _ only.</span></div>` : ""}
      <p class="meta">${esc(info.say)}</p>
    </section>`;
  };
  $("#main").innerHTML = `
    <h1 class="page">Payments</h1>
    <p class="meta" style="margin:0 0 12px">Customers only see the ways that are switched on: after they order, and in the contact box on the home page. ${sq.connected ? "Card payments happen on Square's own page; nobody types a card on this website." : "Nobody pays through this website."} Money goes straight to you.</p>
    ${payments.map(card).join("")}
    <div class="card" style="background:#FFF3E5"><b>Got paid?</b><p class="meta" style="margin:4px 0 10px">${sq.connected ? "Card payments switch on <b>Paid</b> by themselves. For Venmo, Cash App or cash, open" : "Open"} the order and switch on <b>Paid</b>. The Venmo note has the order number in it.</p>
      <button class="btn btn-green btn-sm" type="button" id="toOrders">Go to Orders</button></div>`;
  $("#toOrders").addEventListener("click", () => go("orders"));
  $("#sqConnect")?.addEventListener("click", async e => {
    const b = e.currentTarget; b.disabled = true; b.textContent = "Opening Square…";
    try{ const {url} = await api("POST", "square/connect"); location.href = url; }
    catch(x){ toast(x.message, true); b.disabled = false; b.textContent = "Connect Square"; }
  });
  $("#sqDisc")?.addEventListener("click", () => {
    const box = $("#sqConfirm");
    box.innerHTML = `<span class="confirm">Disconnect Square? Customers stop seeing card right away. Payments already made stay in Square.</span>
      <div class="contact"><button class="btn btn-danger btn-sm" type="button" data-yes>Yes, disconnect</button><button class="btn btn-ghost btn-sm" type="button" data-no>Keep it</button></div>`;
    $("[data-no]", box).addEventListener("click", () => { box.innerHTML = ""; });
    $("[data-yes]", box).addEventListener("click", async e => {
      e.currentTarget.disabled = true;
      try{ await api("POST", "square/disconnect"); toast("Square disconnected. Card payments are off."); renderPayments(); }
      catch(x){ toast(x.message, true); e.currentTarget.disabled = false; }
    });
    $("[data-no]", box).focus();
  });
  $$("[data-pay]").forEach(sec => {
    const p = payments.find(x => x.id === sec.dataset.pay); if (!p || p.coming_soon) return;
    const on = $("[data-payon]", sec), name = $("[data-payname]", sec);
    const save = async (body) => {
      const {payment} = await api("PUT", "payments/" + p.id, body);
      Object.assign(p, payment); on.checked = p.enabled; if (name) name.value = p.handle || "";
      if (p.id === "card"){ if (SQUARE) SQUARE.enabled = p.enabled; const say = $("[data-cardsay]", sec); if (say) say.textContent = p.enabled ? "On: customers see “Pay with card” after they order or sign up." : "Off: customers don't see card yet. Switch it on when you're ready."; }
      return payment;
    };
    on.addEventListener("change", async () => {
      on.disabled = true;
      try{
        const body = {enabled: on.checked};
        if (name && on.checked) body.handle = name.value.trim(); // switching on also saves what's typed
        const r = await save(body);
        toast(`${r.label}: ${r.enabled ? "customers see it" : "hidden from customers"}`);
      }catch(e){ on.checked = !on.checked; toast(e.message, true); if (name && /name first/.test(e.message)) name.focus(); }
      on.disabled = false;
    });
    if (name){
      let last = name.value;
      name.addEventListener("change", async () => {
        const v = name.value.trim().replace(/^[@$]/, "");
        if (v && !PAY_RE.test(v)){ toast(`${p.label} names can only use letters, numbers, - and _`, true); name.focus(); return; }
        if (!v && p.enabled){ toast(`Switch ${p.label} off first, or type your name.`, true); name.value = last; return; }
        try{ const r = await save({handle: v}); last = name.value; toast(r.handle ? `${r.label} name saved: ${PAY_INFO[p.id].prefix}${r.handle}` : `${r.label} name cleared`); }
        catch(e){ toast(e.message, true); name.value = last; }
      });
    }
  });
}

/* ============ Help ============ */
// Cards come from /admin/help/guide.json, written by `npm run guide` from guide/tasks.json, so the words
// here and the pictures/clips were made from the same steps. {Words} in a caption = a button label.
const ui = s => `<b class="ui">${s}</b>`;
const caption = s => esc(s).replace(/\{([^}]+)\}/g, (_, w) => ui(w));
let GUIDE = null;
async function renderHelp(openId){
  if (!GUIDE){
    const res = await fetch("/admin/help/guide.json", {credentials:"same-origin"});
    if (!res.ok) throw new ApiError("Help couldn't load. Check your connection and tap Help again.", res.status);
    GUIDE = await res.json();
  }
  $("#main").innerHTML = `
    <h1 class="page">How do I…</h1>
    <p class="meta" style="margin:0 0 12px">Tap a card to open it. Tap <b>Show me</b> to watch it done. The pink words match the buttons you'll see.</p>
    ${GUIDE.tasks.map(t => `<details class="card help" id="help-${esc(t.id)}">
      <summary><span class="ico" aria-hidden="true">${esc(t.icon)}</span><h3>${esc(t.title)}</h3></summary>
      <div class="body">
        <button class="btn btn-green btn-sm go" type="button" data-clip="${esc(t.clip)}" data-title="${esc(t.title)}">▶ Show me${t.clip_seconds ? ` <span style="font-weight:500">(${Math.round(t.clip_seconds)} sec)</span>` : ""}</button>
        <ol>${t.steps.map((s, i) => `<li><span>${caption(s.caption)}
          <img class="stepimg" src="${esc(s.image)}" alt="Step ${i + 1}: the button to tap is circled in pink" loading="lazy" width="240" height="519"></span></li>`).join("")}</ol>
        ${t.tip ? `<p class="tip">${caption(t.tip)}</p>` : ""}
        ${t.go ? `<button class="btn btn-rose btn-sm go" data-goto="${esc(t.go)}">Take me there</button>` : ""}
      </div>
    </details>`).join("")}`;
  $$("[data-goto]").forEach(b => b.addEventListener("click", () => go(b.dataset.goto)));
  $$("[data-clip]").forEach(b => b.addEventListener("click", () => showClip(b.dataset.clip, b.dataset.title)));
  const first = $(openId ? `#help-${CSS.escape(openId)}` : "details.help");
  if (first){ first.open = true; if (openId) first.scrollIntoView({block:"start"}); }
}
function showClip(src, title){
  const d = document.createElement("div");
  d.className = "clipview"; d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-label", title);
  d.innerHTML = `<div class="cv-top"><b>${esc(title)}</b><button class="btn btn-ghost btn-sm" type="button">Close</button></div>
    <video src="${esc(src)}" playsinline muted autoplay controls preload="auto"></video>`;
  document.body.append(d);
  const close = () => { d.remove(); document.removeEventListener("keydown", esc_); };
  const esc_ = e => { if (e.key === "Escape") close(); };
  $("button", d).addEventListener("click", close);
  document.addEventListener("keydown", esc_);
  $("button", d).focus();
}

/* ============ Old full-screen icon ============ */
// Icons added before the fix open as a full-screen app, which loses the sign-in. Say how to swap it.
if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true){
  const b = document.createElement("div");
  b.className = "wrap"; b.id = "oldIcon";
  b.innerHTML = `<div class="card" style="margin-top:12px; background:#FFF3E5"><b>This home-screen icon is the old kind.</b>
    <p class="meta" style="margin:4px 0 10px">It can lose your sign-in. Remove it and add it again so it always opens your kitchen.</p>
    <button class="btn btn-rose btn-sm" type="button">Show me how</button></div>`;
  $("#main").before(b);
  $("button", b).addEventListener("click", () => { go("help", "home"); });
}

// Put a half-filled form back after the page was reloaded (see Drafts).
async function restoreDraft(d){
  const cfg = {specials: SPECIALS, events: EVENTS, flavors: FLAVORS_CFG, treats: TREATS_CFG, "catering/packages": PACKAGES_CFG}[d.path];
  if (!cfg) return draftStore.clear();
  if (cfg.open) await cfg.open();
  let row = null;
  if (d.id != null){
    const data = await api("GET", cfg.path);
    row = (data[cfg.listKey || cfg.path] || []).find(r => String(r.id) === String(d.id));
    if (!row) return draftStore.clear(); // it was deleted meanwhile
  }
  openForm(cfg, row, d);
}

/* ============ Boot ============ */
(async () => {
  try{
    const me = await api("GET", "me");
    $("#who").textContent = me.email;
    const back = new URLSearchParams(location.search);
    if (back.has("square") || back.has("square_error")){
      history.replaceState(null, "", location.pathname + location.hash);
      setTimeout(() => back.get("square_error") ? toast(back.get("square_error"), true) : toast(`Square connected: ${back.get("name") || "done"}. Switch card on when you're ready.`), 300);
    }
    const d = draftStore.get();
    if (d && TABS[d.tab]) tab = d.tab;
    if (d?.path === "media") mediaRestore = d;
    await go(tab);
    if (d && d.path !== "media") restoreDraft(d).catch(() => draftStore.clear());
    api("GET", "orders?filter=open").then(d => setBadge(d.orders.length)).catch(()=>{});
    api("GET", "requests?filter=open").then(d => setReqBadge(d.new_count)).catch(()=>{});
  }catch(e){ if (e.status !== 401 && e.status !== 503) showGate(e.message); }
})();
</script>
